<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>เข้าสู่ระบบแอดมิน</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf7f2;color:#2f241f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.wrap{width:min(100%,400px)}.brand{text-align:center;font-weight:800;margin-bottom:24px}.brand span{color:#ef5b3d}.card{background:#fff;border:1px solid #e7ddd5;border-radius:20px;padding:32px;box-shadow:0 14px 35px rgba(61,39,28,.08)}h1{font-size:23px;margin:0 0 8px}p{font-size:14px;color:#766a63;line-height:1.6;margin:0 0 24px}label{display:block;font-size:14px;font-weight:700;margin:16px 0 7px}input{width:100%;border:1px solid #d9cec5;border-radius:11px;padding:13px 14px;font:inherit;outline:none}input:focus{border-color:#ef5b3d;box-shadow:0 0 0 3px rgba(239,91,61,.13)}button{width:100%;border:0;border-radius:11px;background:#ef5b3d;color:#fff;padding:14px;margin-top:22px;font:700 15px inherit;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.error{display:none;background:#fde5de;color:#c73e24;border-radius:11px;padding:12px 14px;font-size:14px;line-height:1.5;margin-bottom:18px}.error.show{display:block}.foot{text-align:center;margin-top:20px;font-size:12px;color:#8b817a}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><span>▣</span> สมัครใช้งาน POS</div>
    <section class="card">
      <h1>เข้าสู่ระบบจัดการร้าน</h1>
      <p>กรอกอีเมลและรหัสผ่านของผู้ดูแลร้าน</p>
      <div id="error" class="error" role="alert"></div>
      <form id="loginForm">
        <label for="email">อีเมล</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password">รหัสผ่าน</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="submit" type="submit">เข้าสู่ระบบ</button>
      </form>
    </section>
    <div class="foot">สำหรับร้านค้าที่ได้รับการอนุมัติแล้วเท่านั้น</div>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const button = document.getElementById('submit');
    const errorBox = document.getElementById('error');
    const params = new URLSearchParams(location.search);
    const requestedNext = params.get('next') || '/admin';
    const nextPath = requestedNext.startsWith('/') && !requestedNext.startsWith('//') ? requestedNext : '/admin';

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.classList.remove('show');
      button.disabled = true;
      button.textContent = 'กำลังเข้าสู่ระบบ…';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'เข้าสู่ระบบไม่สำเร็จ');
        location.replace(nextPath);
      } catch (error) {
        errorBox.textContent = error.message || 'เข้าสู่ระบบไม่สำเร็จ กรุณาลองใหม่';
        errorBox.classList.add('show');
      } finally {
        button.disabled = false;
        button.textContent = 'เข้าสู่ระบบ';
      }
    });
  </script>
</body>
</html>
